  });
  $("projectSel").addEventListener("change", () => { project = $("projectSel").value; render(); });
  $("tagSel").addEventListener("change", () => { tag = $("tagSel").value; render(); });
  $("toggles").addEventListener("click", e => {
    const b = e.target.closest("button[data-col]"); if (!b) return;
    const k = b.dataset.col;
    hiddenCols = hiddenCols.includes(k) ? hiddenCols.filter(x => x !== k) : [...hiddenCols, k];
    localStorage.setItem("agentgrid.hidden", JSON.stringify(hiddenCols));
    $("toggles").dataset.sig = ""; applyVisibility(); render();
  });
  $("newBtn").addEventListener("click", openNewAgent);
  $("search").addEventListener("input", () => { query = $("search").value; render(); });
  $("search").addEventListener("keydown", e => { if (e.key === "Escape") $("search").blur(); });

  // board: click selects/opens, drag re-files
  $("board").addEventListener("click", e => {
    const open = e.target.closest("[data-open]");
    if (open) {
      // straight in from the card; the refusal, if any, arrives as a toast.
      // Disabled while in flight: a fast double-click raced two attach
      // requests, and the second opened a second tab onto the same session.
      e.stopPropagation();
      if (open.disabled) return;
      open.disabled = true;
      post("/api/open", {sessionId: open.dataset.open}).then(r => {
        toast((r && (r.error || r.message)) || "Opened.");
        setTimeout(() => { open.disabled = false; }, 1500);
      });
      return;
    }
    const card = e.target.closest(".card");
    if (card) openSession(card.dataset.id);
  });
  $("board").addEventListener("dragstart", e => {
    const card = e.target.closest(".card"); if (!card) return;
    e.dataTransfer.setData("text/plain", card.dataset.id);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging");
  });
  $("board").addEventListener("dragend", e => {
    const card = e.target.closest(".card");
    if (card) card.classList.remove("dragging");
    document.querySelectorAll(".col-body.over").forEach(el => el.classList.remove("over"));
  });
  document.querySelectorAll(".col").forEach(col => {
    const key = col.dataset.key, body = col.querySelector("[data-body]");
    body.addEventListener("dragover", e => {
      // Working is not a destination: saying a process runs does not start one
      if (key === "working") return;
      e.preventDefault(); body.classList.add("over");
    });
    body.addEventListener("dragleave", () => body.classList.remove("over"));
    body.addEventListener("drop", e => {
      e.preventDefault(); body.classList.remove("over");
      if (key === "working") return;
      const id = e.dataTransfer.getData("text/plain");
      if (id) moveSession(id, key);
    });
  });

  // panel
  $("pClose").addEventListener("click", closePanel);
  $("scrim").addEventListener("click", closePanel);
  $("panel").addEventListener("click", e => {
    const mv = e.target.closest("button.mv");
    if (mv) { moveSession(openId, mv.dataset.to); return; }
    if (e.target.closest("#openBtn")) {
      const btn = e.target.closest("#openBtn");
      if (btn.disabled) return;
      btn.disabled = true;   // same double-click race as the card button
      post("/api/open", {sessionId: openId}).then(r => {
        toast((r && (r.error || r.message)) || "Opened.");
        setTimeout(() => { btn.disabled = false; }, 1500);
      });
      return;
    }
    if (e.target.closest("#unreadBtn")) {
      // forgetting the read position is the honest way to say "not seen"
      post("/api/read", {sessionId: openId, unread: true});
      const s = sessions.find(x => x.sessionId === openId);
      if (s) s.unread = true;
      metaSig = ""; renderPanel(); render();
      return;
    }
    const rr = e.target.closest(".rrow");
    if (rr) {
      openAgent = rr.dataset.agent || null;
      rosterSig = transSig = ""; transFirst = true;
      renderPanel(); refreshTranscript();
      return;
    }
    const tx = e.target.closest(".tagx");
    if (tx) { saveTags((sessions.find(x => x.sessionId === openId).tags || []).filter(t => t !== tx.dataset.tag)); return; }
    const ta = e.target.closest("[data-add]");
    if (ta) {
      const s = sessions.find(x => x.sessionId === openId);
      saveTags([...(s.tags || []), ta.dataset.add]);
      return;
    }
    if (e.target.closest("#qaTodo")) { quickAdd(true); return; }
    if (e.target.closest("#qaNote")) { quickAdd(false); return; }
  });
  $("panel").addEventListener("keydown", e => {
    if (e.target.id === "renameIn" && e.key === "Enter") {
      post("/api/rename", {sessionId: openId, name: e.target.value.trim()}).then(() => poll());
      e.target.blur();
    }
    if (e.target.id === "tagIn" && e.key === "Enter") {
      const v = e.target.value.trim();
      if (v) {
        const s = sessions.find(x => x.sessionId === openId);
        saveTags([...(s.tags || []), v]);
      }
    }
    if (e.target.id === "qaIn" && e.key === "Enter") quickAdd(true);
  });
  function toggleMentionItem(cb) {
    post("/api/notes/toggle", {date: cb.dataset.mday, page: cb.dataset.mpage,
                               line: Number(cb.dataset.mline)})
      .then(() => { loadMentions(); if (day === cb.dataset.mday) loadNotes(true); });
  }
  $("panel").addEventListener("change", e => {
    const cb = e.target.closest("input[data-mday]");
    if (cb) toggleMentionItem(cb);
  });
  // the whole line toggles here too, links excepted
  $("panel").addEventListener("click", e => {
    if (e.target.closest("a") || e.target.closest("input")) return;
    const row = e.target.closest(".mline"); if (!row) return;
    const cb = row.querySelector("input[data-mday]"); if (!cb) return;
    cb.checked = !cb.checked;
    toggleMentionItem(cb);
  });

  // notes: day nav
  $("dayPrev").addEventListener("click", () => gotoDay(isoShift(day, -1)));
  $("dayNext").addEventListener("click", () => gotoDay(isoShift(day, 1)));
  $("dayToday").addEventListener("click", () => gotoDay(todayIso()));

  // pad
  const pad = $("pad");
  pad.addEventListener("input", () => { scheduleSave(); checkAtMenu(); });
  pad.addEventListener("keydown", padKeydown);
  pad.addEventListener("blur", () => { hideAt(); flushSave(); });
  pad.addEventListener("click", checkAtMenu);
  window.addEventListener("beforeunload", () => { flushSave(); });

  // @ menu: mousedown, because click fires after the textarea loses focus
  $("atMenu").addEventListener("mousedown", e => {
    e.preventDefault();
    const b = e.target.closest("button[data-at]");
    if (b) insertAt(Number(b.dataset.at));
  });

  // page tabs
  $("pages").addEventListener("click", e => {
    const menuBtn = e.target.closest(".tmenu");
    if (menuBtn) {
      e.stopPropagation();
      openPageMenu(menuBtn.dataset.menu, menuBtn.closest(".ptab").getBoundingClientRect());
      return;
    }
    const tab = e.target.closest(".ptab");
    if (tab) { gotoPage(tab.dataset.page); return; }
    const gl = e.target.closest(".glabel");
    if (gl) {
      const g = gl.dataset.glabel;
      const shut = collapsedGroups.includes(g);
      post("/api/notes/collapse", {date: day, group: g, collapsed: !shut})
        .then(() => loadNotes(true));
      return;
    }
    if (e.target.closest("#pageAdd")) { startPageAdd(); return; }
    if (e.target.closest("#pageGrid")) { openPageGrid(); return; }
    if (e.target.closest("#pageManage")) { openManage(); return; }
  });
  $("pages").addEventListener("contextmenu", e => {
    const tab = e.target.closest(".ptab");
    if (tab) { e.preventDefault(); openPageMenu(tab.dataset.page, tab.getBoundingClientRect()); }
  });
  $("pages").addEventListener("dragstart", e => {
    const tab = e.target.closest(".ptab");
    const gl = e.target.closest(".glabel");
    if (tab) { dragPage = tab.dataset.page; dragGroup = null; }
    else if (gl) { dragGroup = gl.dataset.glabel; dragPage = null; }
  });
  $("pages").addEventListener("dragover", e => {
    if (dragPage || dragGroup) e.preventDefault();
  });
  $("pages").addEventListener("drop", e => {
    e.preventDefault();
    const tab = e.target.closest(".ptab");
    const gl = e.target.closest(".glabel");
    const before = tab ? tab.dataset.page :
      gl ? currentPages.find(p => pageGroups[p] === gl.dataset.glabel) : null;
    if (dragPage && before && before !== dragPage) {
      const order = currentPages.filter(p => p !== dragPage);
      order.splice(order.indexOf(before), 0, dragPage);
      post("/api/notes/order", {date: day, order}).then(() => loadNotes(true));
    } else if (dragGroup && before) {
      post("/api/notes/movegroup", {date: day, group: dragGroup, before})
        .then(() => loadNotes(true));
    }
    dragPage = dragGroup = null;
  });

  // page menu
  $("pmenu").addEventListener("click", e => {
    const wd = e.target.closest("button[data-wd]");
    if (wd) { toggleWeekday(Number(wd.dataset.wd)); return; }
    const b = e.target.closest("button[data-act]");
    if (b) menuAction(b.dataset.act, b);
  });
  $("pmenu").addEventListener("keydown", e => {
    if (e.target.id === "newGroupIn" && e.key === "Enter") {
      const g = e.target.value.trim();
      if (g) post("/api/notes/group", {date: day, page: menuFor, group: g})
        .then(() => { closeMenus(); loadNotes(true); });
    }
  });

  // rail
  $("railScopeBtn").addEventListener("click", async () => {
    await flushSave();
    railScope = railScope === "all" ? "page" : "all";
    localStorage.setItem("agentgrid.railScope", railScope);
    renderRail();
  });
  $("spans").addEventListener("click", e => {
    const b = e.target.closest("button[data-span]"); if (!b) return;
    span = b.dataset.span;
    $("spans").querySelectorAll("button").forEach(x =>
      x.setAttribute("aria-pressed", String(x === b)));
    loadNotes(true);
  });
  $("railCollapse").addEventListener("click", () => {
    railOpen = !railOpen;
    localStorage.setItem("agentgrid.rail", railOpen ? "1" : "0");
    applyRail();
  });
  async function toggleRailItem(cb) {
    await flushSave();   // the pad's text must land before the file is rewritten
    const r = await post("/api/notes/toggle",
      {date: cb.dataset.tday, page: cb.dataset.tpage, line: Number(cb.dataset.tline)});
    if (r && r.error) toast(r.error);
    // the file changed underneath us: re-read both sides
    padDirty = false;
    loadNotes(false);
  }
  $("railBody").addEventListener("change", e => {
    const cb = e.target.closest("input[data-tday]");
    if (cb) toggleRailItem(cb);
  });
  // the whole row toggles, not just the 13px box — but a link inside the row
  // still navigates, and a click on the box itself already fired "change"
  $("railBody").addEventListener("click", e => {
    if (e.target.closest("a") || e.target.closest("input")) return;
    const row = e.target.closest(".rit"); if (!row) return;
    const cb = row.querySelector("input[data-tday]"); if (!cb) return;
    cb.checked = !cb.checked;   // instant feedback; the reload confirms it
    toggleRailItem(cb);
  });

  // mention links anywhere: switch to the board and open that session
  document.addEventListener("click", e => {
    const a = e.target.closest("a.mention");
    if (!a) return;
    e.preventDefault();
    const s = sessions.find(x => x.slug === a.dataset.slug);
    if (!s) { toast(`No live session @${a.dataset.slug}`); return; }
    if (view === "notes") setView("split");
    $("gridModal").hidden = true;
    openSession(s.sessionId);
  });

  // manage panel
  $("mClose").addEventListener("click", closeManage);
  $("scrim2").addEventListener("click", closeManage);
  $("mBody").addEventListener("click", async e => {
    const act = e.target.closest("button[data-mact]");
    if (act) {
      const name = act.dataset.mname;
      if (act.dataset.mact === "delete") {
        const p = managePages.find(x => x.name === name);
        const n = p ? p.days : 0;
        // the destructive confirmation carries the day count
        if (!confirm(`Delete "${name}" everywhere — ${n} day${n === 1 ? "" : "s"} of notes?`)) return;
        const r = await post("/api/notes/deleteall", {page: name});
        toast(`Removed ${r && r.removed != null ? r.removed : ""} day${(r && r.removed === 1) ? "" : "s"} of "${name}".`);
        if (page === name) page = "";
        refreshManage();
        return;
      }
      expandedRow = (expandedRow && expandedRow.name === name &&
                     expandedRow.kind === act.dataset.mact)
        ? null : {name, kind: act.dataset.mact};
      renderManage();
      const inp = $("mRenameIn") || $("mGroupIn");
      if (inp) { inp.focus(); inp.select(); }
      return;
    }
    if (e.target.closest("[data-mcancel]")) { expandedRow = null; renderManage(); return; }
    const rok = e.target.closest("[data-mrenameok]");
    if (rok) {
      const name = rok.dataset.mrenameok, to = $("mRenameIn").value.trim();
      if (to && to !== name) {
        const r = await post("/api/notes/renameall", {page: name, name: to});
        if (r && r.error) { toast(r.error); return; }
        if (page === name) page = to;
      }
      expandedRow = null; refreshManage(); return;
    }
    const gok = e.target.closest("[data-mgroupok]");
    if (gok) {
      await post("/api/notes/group", {date: day, page: gok.dataset.mgroupok,
                                      group: $("mGroupIn").value.trim()});
      expandedRow = null; refreshManage(); return;
    }
    const mwd = e.target.closest("button[data-mwd]");
    if (mwd) {
      const name = mwd.dataset.mpage;
      const p = managePages.find(x => x.name === name);
      let days = p && p.pinned ? [...(p.weekdays || [])] : [];
      const i = Number(mwd.dataset.mwd);
      days = days.includes(i) ? days.filter(d => d !== i) : [...days, i];
      await post("/api/notes/pin", {page: name, pinned: true, group: p && p.group || "", days});
      refreshManage(); return;
    }
    const mev = e.target.closest("[data-mevery]");
    if (mev) {
      const p = managePages.find(x => x.name === mev.dataset.mevery);
      await post("/api/notes/pin", {page: mev.dataset.mevery, pinned: true,
                                    group: p && p.group || "", days: []});
      refreshManage(); return;
    }
    const moff = e.target.closest("[data-moff]");
    if (moff) {
      await post("/api/notes/pin", {page: moff.dataset.moff, pinned: false, group: "", days: []});
      refreshManage(); return;
    }
  });
  $("mBody").addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.id === "mRenameIn")
      e.target.parentElement.querySelector("[data-mrenameok]").click();
    if (e.key === "Enter" && e.target.id === "mGroupIn")
      e.target.parentElement.querySelector("[data-mgroupok]").click();
  });

  // grid / history modal
  $("gridModal").addEventListener("click", async e => {
    if (e.target === $("gridModal")) { $("gridModal").hidden = true; return; }
    const back = e.target.closest("[data-back]");
    if (back) { openPageGrid(); return; }
    const goto = e.target.closest("[data-goto]");
    if (goto) {
      $("gridModal").hidden = true;
      await flushSave();
      day = goto.dataset.goto; page = goto.dataset.gotop;
      if (view === "board") setView("notes");
      loadNotes(false);
      return;
    }
    const hist = e.target.closest("[data-hist]");
    if (hist) { openHistory(hist.dataset.hist); return; }
  });

  // new agent sheet
  $("naCancel").addEventListener("click", closeNewAgent);
  $("modal").addEventListener("click", e => { if (e.target === $("modal")) closeNewAgent(); });
  $("naStart").addEventListener("click", startAgent);
  $("naEngine").addEventListener("change", syncEngineModels);
  // project picker preferences: favourite, hide, and add-by-hand — the scan
  // is one level deep on purpose, so ~/Desktop/anything needs a way in
  $("naProject").addEventListener("change", syncProjectButtons);
  $("naFav").addEventListener("click", async () => {
    const p = projectsCache.find(x => x.path === $("naProject").value); if (!p) return;
    const r = await post("/api/projects/pref", {path: p.path, fav: !p.fav});
    projectsCache = (r && r.projects) || projectsCache;
    fillProjectSelect(p.path);
  });
  $("naHide").addEventListener("click", async () => {
    const p = projectsCache.find(x => x.path === $("naProject").value); if (!p) return;
    const r = await post("/api/projects/pref", {path: p.path, hidden: !p.hidden});
    projectsCache = (r && r.projects) || projectsCache;
    // hiding what you had selected should not leave it selected
    fillProjectSelect(p.hidden ? p.path : "");
  });
  $("naAddProj").addEventListener("click", () => {
    $("naAddRow").hidden = !$("naAddRow").hidden;
    if (!$("naAddRow").hidden) $("naAddPath").focus();
  });
  async function addProjectPath() {
    const path = $("naAddPath").value.trim(); if (!path) return;
    const r = await post("/api/projects/add", {path});
    if (r && r.error) { $("naErr").textContent = r.error; return; }
    $("naErr").textContent = "";
    projectsCache = (r && r.projects) || projectsCache;
    fillProjectSelect(r.path);
    $("naAddPath").value = ""; $("naAddRow").hidden = true;
    toast(`Added ${r.path.split("/").pop()}.`);
  }
  $("naAddGo").addEventListener("click", addProjectPath);
  $("naAddPath").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); addProjectPath(); }
  });
  // the library: picking a saved agent fills the sheet; Save stores the
  // sheet under the Name; a definition is just a saved way of launching
  $("naLib").addEventListener("change", () => {
    const def = agentLibrary.find(a => a.name === $("naLib").value);
    $("naLibDel").hidden = !def;
    if (!def) return;
    $("naEngine").value = def.engine;
    syncEngineModels();
    if (def.model && ![...$("naModel").options].some(o => o.value === def.model)) {
      $("naModel").insertAdjacentHTML("beforeend",
        `<option value="${esc(def.model)}">${esc(def.model)}</option>`);
    }
    $("naModel").value = def.model || "";
    $("naSys").value = def.systemPrompt || "";
    $("naName").value = def.name;
    $("naTask").focus();
  });
  $("naLibSave").addEventListener("click", async () => {
    const name = $("naName").value.trim() || $("naLib").value;
    if (!name) { $("naErr").textContent = "Give it a name first — that is what the library files it under."; return; }
    const r = await post("/api/agents/save", {
      name, engine: $("naEngine").value, model: $("naModel").value,
      systemPrompt: $("naSys").value.trim(),
    });
    if (r && r.error) { $("naErr").textContent = r.error; return; }
    agentLibrary = (r && r.agents) || agentLibrary;
    fillLibrarySelect(name);
    toast(`Saved "${name}" to the library.`);
  });
  $("naLibDel").addEventListener("click", async () => {
    const name = $("naLib").value; if (!name) return;
    const r = await post("/api/agents/delete", {name});
    agentLibrary = (r && r.agents) || agentLibrary;
    fillLibrarySelect("");
    toast(`Removed "${name}" from the library.`);
  });
  applyAlertsBtn();
  $("alertsBtn").addEventListener("click", async () => {
    if (!alertsOn) {
      // permission must be asked from a user gesture, and this is the one
      if (typeof Notification === "undefined") { toast("This browser has no notifications."); return; }
      if (Notification.permission !== "granted") {
        const p = await Notification.requestPermission();
        if (p !== "granted") { toast("Notifications are blocked for this site."); return; }
      }
      alertsOn = true;
    } else {
      alertsOn = false;
    }
    localStorage.setItem("agentgrid.alerts", alertsOn ? "1" : "0");
    applyAlertsBtn();
    toast(alertsOn ? "Alerts on — you will be notified when an agent needs you or replies." : "Alerts off.");
  });
  $("naName").addEventListener("keydown", e => {
    // the task is required; submitting from the name box would start an agent
    // with nothing to do
    if (e.key === "Enter") { e.preventDefault(); $("naTask").focus(); }
  });
  $("naTask").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); startAgent(); }
  });

  // dismiss popovers on outside click
  document.addEventListener("mousedown", e => {
    if (!$("pmenu").hidden && !e.target.closest("#pmenu")) closeMenus();
  });

  // keyboard: Escape closes the topmost thing; single keys never fire while typing
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (!$("pmenu").hidden || !$("atMenu").hidden) { closeMenus(); return; }
      if (!$("gridModal").hidden) { $("gridModal").hidden = true; return; }
      if (!$("modal").hidden) { closeNewAgent(); return; }
      if ($("managePanel").classList.contains("on")) { closeManage(); return; }
      if ($("panel").classList.contains("on")) { closePanel(); return; }
      return;
    }
    if (isTyping()) return;
    if (e.key === "n") { e.preventDefault(); openNewAgent(); }
    else if (e.key === "/") { e.preventDefault(); $("search").focus(); $("search").select(); }
  });
}

function saveTags(tags) {
  post("/api/tags", {sessionId: openId, tags}).then(r => {
    const s = sessions.find(x => x.sessionId === openId);
    if (s && r && r.tags) s.tags = r.tags;
    metaSig = ""; renderPanel(); render(); renderSelects();
  });
}

/* --------------------------------------------------------------------- init */

buildColumns();
bindEvents();
applyVisibility();
applyRail();
setView(view);
$("spans").querySelectorAll("button").forEach(b =>
  b.setAttribute("aria-pressed", String(b.dataset.span === span)));

poll(); setInterval(poll, 2000);                                       // fleet
setInterval(() => { if (!document.hidden) render(); }, 1000);          // ages tick
setInterval(() => { if (view !== "notes" && !document.hidden) loadNotes(true); },
            30000);                                                    // open count
loadNotes(false);   // first fill: padDirty is false, so this cannot clobber anything
</script>
</body>
</html>
